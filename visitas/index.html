<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="robots" content="noindex">
<title>Visitas · PYLSA</title>
<style>
  :root { --azul:#1F3A5F; --azul2:#1F5FA8; --gris:#6B7E8F; --fondo:#F2F5F8; --verde:#2DB84B; --rojo:#C0392B; --ambar:#D98E04; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--fondo); color:#1B2733; }
  header { background:var(--azul); color:#fff; padding:16px 18px 18px; padding-top:calc(16px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:19px; }
  header p { margin:3px 0 0; font-size:13px; opacity:.8; }
  main { padding:14px; max-width:560px; margin:0 auto; }
  .tarjeta { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .tarjeta h2 { margin:0 0 10px; font-size:16px; color:var(--azul); }
  .contador { display:flex; align-items:baseline; gap:8px; }
  .contador b { font-size:34px; color:var(--azul); }
  .barra { height:8px; background:#E3E8EE; border-radius:9px; margin-top:8px; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--verde); width:0; transition:width .4s; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; color:#33475B; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid #CBD5DF; border-radius:10px; background:#fff; }
  textarea { min-height:64px; resize:vertical; }
  button { font:inherit; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:700; width:100%; cursor:pointer; }
  .primario { background:var(--azul2); color:#fff; }
  .secundario { background:#E6EEF7; color:var(--azul2); }
  .salida { background:var(--ambar); color:#fff; padding:10px 12px; font-size:14px; width:auto; }
  button:disabled { opacity:.5; }
  .visita { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid #EEF1F4; }
  .visita:first-of-type { border-top:0; }
  .visita .cli { font-weight:600; }
  .visita .det { font-size:13px; color:var(--gris); margin-top:2px; }
  .vacio { color:var(--gris); font-size:14px; }
  .estado { font-size:13px; padding:9px 11px; border-radius:9px; margin-top:10px; }
  .estado.ok { background:#E9F8EC; color:#1E7A33; }
  .estado.mal { background:#FDECEA; color:var(--rojo); }
  .estado.info { background:#EEF3F9; color:var(--azul); }
  #capa { position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh; background:#000; z-index:10; display:none; overflow:hidden; }
  #capa video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #capa .controles { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); display:flex; gap:10px; background:linear-gradient(transparent, rgba(0,0,0,.75) 35%); }
  #capa .titulo { position:absolute; top:0; left:0; right:0; z-index:2; color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); font-weight:600; background:rgba(0,0,0,.5); }
  #disparo { background:#fff; color:#000; font-size:18px; padding:18px; }
  #cancelar { background:#333; color:#fff; flex:0 0 35%; }
  #previa { width:100%; border-radius:10px; margin-top:10px; display:none; }
  #error { display:none; }
  details summary { cursor:pointer; color:var(--azul2); font-weight:600; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Registro de visitas</h1>
  <p id="quien">Cargando…</p>
</header>
<main>
  <div id="error" class="tarjeta"><div class="estado mal" id="errorTxt"></div></div>

  <div id="app" style="display:none">
    <div class="tarjeta">
      <div class="contador"><b id="nHoy">0</b><span>visitas hoy · mínimo <span id="nMin">0</span></span></div>
      <div class="barra"><i id="barra"></i></div>
    </div>

    <div class="tarjeta" id="formLlegada">
      <h2>Nueva visita: registrar llegada</h2>
      <label for="cliente">Cliente o prospecto</label>
      <input id="cliente" autocomplete="off" placeholder="Nombre del negocio">
      <label for="motivo">Motivo</label>
      <select id="motivo">
        <option>Venta</option><option>Seguimiento de cotización</option><option>Cobranza</option>
        <option>Prospección</option><option>Entrega / incidencia</option><option>Otro</option>
      </select>
      <label for="comentario">Comentario (opcional)</label>
      <textarea id="comentario" placeholder="Qué se habló, qué se ofreció…"></textarea>
      <div style="margin-top:14px"><button class="primario" id="btnLlegada">📷 Foto y registrar llegada</button></div>
      <div id="estadoLlegada"></div>
    </div>

    <div class="tarjeta">
      <h2>Mis visitas de hoy</h2>
      <div id="listaHoy"></div>
    </div>

    <div class="tarjeta">
      <details>
        <summary>Mi historial reciente</summary>
        <div id="listaHist" style="margin-top:10px"></div>
      </details>
    </div>
  </div>
</main>

<div id="capa">
  <div class="titulo" id="capaTitulo">Toma la foto del cliente</div>
  <video id="video" playsinline autoplay muted></video>
  <div class="controles">
    <button id="cancelar">Cancelar</button>
    <button id="disparo">Tomar foto</button>
  </div>
</div>
<canvas id="lienzo" style="display:none"></canvas>

<script>
const API = 'https://danielrodriguez.app.n8n.cloud/webhook';
const codigo = new URLSearchParams(location.search).get('v') || '';
const $ = id => document.getElementById(id);
let datos = null, ocupado = false;

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function error(msg) { $('error').style.display = 'block'; $('errorTxt').textContent = msg; $('app').style.display = 'none'; $('quien').textContent = 'PYLSA'; }
function estado(id, tipo, msg) { $(id).innerHTML = msg ? `<div class="estado ${tipo}">${esc(msg)}</div>` : ''; }

async function cargar() {
  if (!codigo) return error('Este enlace no es válido. Pide tu enlace personal a Dirección Regional.');
  try {
    const r = await fetch(`${API}/visitas-vendedor?v=${encodeURIComponent(codigo)}`, { cache: 'no-store' });
    datos = await r.json();
  } catch (e) { return error('Sin conexión. Revisa tus datos móviles y recarga la página.'); }
  if (!datos.ok) return error(datos.error || 'No se pudo cargar.');
  $('quien').textContent = `${datos.vendedor} · ${datos.sucursal}`;
  $('app').style.display = 'block';
  pintar();
}

function pintar() {
  const hoy = datos.hoy || [];
  $('nHoy').textContent = hoy.length;
  $('nMin').textContent = datos.minimo || 0;
  $('barra').style.width = Math.min(100, datos.minimo ? hoy.length / datos.minimo * 100 : 0) + '%';
  $('listaHoy').innerHTML = hoy.length ? hoy.map(v => `
    <div class="visita"><div>
      <div class="cli">${esc(v.cliente)}</div>
      <div class="det">${esc(v.motivo)} · llegada ${esc(v.llegada || '—')}${v.salida ? ` · salida ${esc(v.salida)} (${esc(v.duracion)} min)` : ''}</div>
    </div>${v.salida ? '<span style="color:#2DB84B;font-weight:700">✓</span>'
      : `<button class="salida" data-id="${esc(v.id)}" data-cli="${esc(v.cliente)}">Registrar salida</button>`}</div>`).join('')
    : '<p class="vacio">Aún no has registrado visitas hoy.</p>';
  document.querySelectorAll('.salida').forEach(b => b.onclick = () => registrar('SALIDA', b.dataset.id, b.dataset.cli));
  const h = datos.historial || [];
  $('listaHist').innerHTML = h.length ? h.map(v => `
    <div class="visita"><div><div class="cli">${esc(v.cliente)}</div>
    <div class="det">${esc(v.fecha)} · ${esc(v.llegada || '—')}${v.salida ? '–' + esc(v.salida) : ' · sin salida'}</div></div></div>`).join('')
    : '<p class="vacio">Sin visitas anteriores.</p>';
}

function ubicacion() {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal(new Error('Tu teléfono no permite obtener la ubicación.'));
    navigator.geolocation.getCurrentPosition(
      p => ok(p.coords),
      e => mal(new Error(e.code === 1
        ? 'Debes permitir la ubicación para registrar la visita. Actívala en los ajustes del navegador y recarga.'
        : 'No se pudo obtener tu ubicación. Sal a un lugar abierto y vuelve a intentarlo.')),
      { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  });
}

let flujo = null;
async function abrirCamara(titulo) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Tu navegador no permite usar la cámara. Abre el enlace en Chrome o Safari.');
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false });
  } catch (e) {
    throw new Error('Debes permitir el uso de la cámara para registrar la visita.');
  }
  $('capaTitulo').textContent = titulo;
  $('video').srcObject = flujo;
  $('capa').style.display = 'flex';
  return new Promise((ok, mal) => {
    $('disparo').onclick = () => ok(true);
    $('cancelar').onclick = () => mal(new Error('cancelado'));
  });
}
function cerrarCamara() { $('capa').style.display = 'none'; if (flujo) flujo.getTracks().forEach(t => t.stop()); flujo = null; }

function capturar(coords, texto) {
  const v = $('video'), c = $('lienzo');
  const escala = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * escala); c.height = Math.round(v.videoHeight * escala);
  const g = c.getContext('2d');
  g.drawImage(v, 0, 0, c.width, c.height);
  const lineas = [
    `${datos.vendedor} · ${texto}`,
    new Date().toLocaleString('es-MX', { timeZone: 'America/Mexico_City' }),
    `GPS ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)} (±${Math.round(coords.accuracy)} m)`,
  ];
  const t = Math.max(14, Math.round(c.width / 40));
  g.font = `bold ${t}px Arial`;
  const alto = lineas.length * (t + 6) + 14;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - alto, c.width, alto);
  g.fillStyle = '#fff';
  lineas.forEach((l, i) => g.fillText(l, 10, c.height - alto + 10 + (i + 1) * (t + 6) - 6));
  return c.toDataURL('image/jpeg', 0.72);
}

async function registrar(tipo, idVisita, cliente) {
  if (ocupado) return;
  const caja = 'estadoLlegada';
  const datosForm = { cliente: $('cliente').value.trim(), motivo: $('motivo').value, comentario: $('comentario').value.trim() };
  if (tipo === 'LLEGADA' && datosForm.cliente.length < 3) return estado(caja, 'mal', 'Escribe el nombre del cliente o prospecto.');
  ocupado = true; $('btnLlegada').disabled = true;
  try {
    estado(caja, 'info', 'Obteniendo tu ubicación…');
    const gps = ubicacion();
    await abrirCamara(tipo === 'LLEGADA' ? `Llegada: ${datosForm.cliente}` : `Salida: ${cliente}`);
    $('disparo').disabled = true; $('disparo').textContent = 'Esperando GPS…';
    let coords;
    try { coords = await gps; } finally { $('disparo').disabled = false; $('disparo').textContent = 'Tomar foto'; }
    const foto = capturar(coords, tipo === 'LLEGADA' ? `Llegada · ${datosForm.cliente}` : `Salida · ${cliente}`);
    cerrarCamara();
    estado(caja, 'info', 'Enviando registro…');
    const cuerpo = {
      codigo, tipo, id_visita: idVisita || '', ...(tipo === 'LLEGADA' ? datosForm : {}),
      lat: coords.latitude, lng: coords.longitude, precision: coords.accuracy,
      foto, origen_foto: 'camara', hora_telefono: new Date().toISOString(),
    };
    const r = await fetch(`${API}/visitas-registro`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || 'No se pudo registrar.');
    if (tipo === 'LLEGADA') { $('cliente').value = ''; $('comentario').value = ''; }
    estado(caja, 'ok', `${tipo === 'LLEGADA' ? 'Llegada' : 'Salida'} registrada a las ${res.hora.slice(0, 5)}. Recuerda registrar la salida al terminar.`.replace(tipo === 'SALIDA' ? ' Recuerda registrar la salida al terminar.' : '§', ''));
    await cargar();
  } catch (e) {
    cerrarCamara();
    estado(caja, e.message === 'cancelado' ? '' : 'mal', e.message === 'cancelado' ? '' : e.message);
  } finally { ocupado = false; $('btnLlegada').disabled = false; }
}

$('btnLlegada').onclick = () => registrar('LLEGADA');
cargar();
</script>
</body>
</html>
